[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpify"
version = "0.1.1"
description = "One command, four channels — turn any existing app into OpenAPI + MCP Server + Claude Code Skill + CLI for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "RYOSEIWORLD合同会社 / imai-design", email = "imai@telewor.com" }
]
keywords = ["mcp", "openapi", "ai-agent", "claude", "skill", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=5.1"]
dev = ["pytest>=7.0", "pyyaml>=5.1"]

[project.urls]
Homepage = "https://github.com/imai-design/mcpify"
Repository = "https://github.com/imai-design/mcpify"

[project.scripts]
mcpify = "mcpify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
